<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <!-- Create form -->
    <form id="postForm">
        <input type="number" id="postId" name="id" placeholder="ID" required>
        <input type="number" id="postUserId" name="userId" placeholder="User ID" required>
        <input type="text" id="postTitle" name="title" placeholder="Title" required>
        <textarea id="postBody" name="body" placeholder="Body" required></textarea>
        <button type="submit">Submit</button>
    </form>

    <!-- Update form (separate) - hidden by default -->
    <form id="updateForm" style="display:none; margin-top:16px;">
        <input type="number" id="updPostId" name="id" placeholder="ID" readonly>
        <input type="number" id="updPostUserId" name="userId" placeholder="User ID" required>
        <input type="text" id="updPostTitle" name="title" placeholder="Title" required>
        <textarea id="updPostBody" name="body" placeholder="Body" required></textarea>
        <button type="submit">Update</button>
        <button type="button" id="cancelUpdate">Cancel</button>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="index.js"></script>
</body>
</html>
